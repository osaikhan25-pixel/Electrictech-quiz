<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сургалтын Систем</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f4f6f8; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-container { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .nav-btns { display: flex; gap: 8px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 12px; border: none; background: #eef2f5; color: #555; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .nav-btn.active { background: #2563eb; color: white; }
        
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .btn { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 14px; }
        .btn-danger { background: #dc2626; padding: 6px 12px; font-size: 12px; width: auto; }
        .btn-success { background: #16a34a; }
        
        input, textarea, select { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        .topic-item { background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
        .topic-item:hover { border-color: #2563eb; }
        .quiz-opt { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; border-radius: 8px; margin-top: 8px; cursor: pointer; }
        .quiz-opt:active { background: #e2e8f0; }
        .hidden { display: none; }
        .sub-nav { display: flex; gap: 10px; margin-bottom: 15px; }
        .sub-nav button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #2563eb; background: #eff6ff; color: #2563eb; font-weight: bold; cursor: pointer; }
        .sub-nav button.active { background: #2563eb; color: white; }
        
        .lesson-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .item-box { background: #f9fafb; border-left: 4px solid #2563eb; padding: 12px; margin-bottom: 12px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="nav-btns">
        <button id="btn-learn" class="nav-btn active" onclick="switchTab('learn')">📂 Бүлгүүд</button>
        <button id="btn-admin" class="nav-btn" onclick="switchTab('admin')">⚙️ Засварлах</button>
    </div>

    <!-- 1. НҮҮР ХЭСЭГ -->
    <div id="tab-learn">
        <div id="topic-list-view">
            <h3 style="margin-top:0;">Сургалтын бүлгүүд</h3>
            <div id="topics-container"></div>
        </div>

        <div id="topic-detail-view" class="hidden">
            <button onclick="backToTopics()" style="background:none; border:none; color:#2563eb; font-weight:bold; cursor:pointer; margin-bottom:10px;">← Буцах</button>
            <h2 id="detail-topic-title" style="margin-top:0;"></h2>
            
            <div class="sub-nav">
                <button id="sub-btn-theory" class="active" onclick="switchSubTab('theory')">📖 Онол & Зураг</button>
                <button id="sub-btn-quiz" onclick="switchSubTab('quiz')">🧠 Сорил тестүүд</button>
            </div>

            <!-- Онолуудын жагсаалт -->
            <div id="sub-tab-theory">
                <div id="theory-items-container"></div>
            </div>

            <!-- Сорил тестүүдийн жагсаалт -->
            <div id="sub-tab-quiz" class="hidden">
                <div id="quiz-items-container"></div>
            </div>
        </div>
    </div>

    <!-- 2. ЗАСВАРЛАХ ХЭСЭГ (EDITOR) -->
    <div id="tab-admin" class="hidden">
        <h3>⚙️ Онол ба Сорил тест нэмэх</h3>
        <div class="card">
            <label><b>1. Али бүлэгт нэмэх вэ?:</b></label>
            <select id="select-topic" onchange="toggleNewTopicInput()">
            </select>

            <div id="new-topic-box" class="hidden">
                <label>Шинэ бүлгийн нэр:</label>
                <input type="text" id="add-new-topic-name" placeholder="жишээ нь: 1-р бүлэг: Хөдөлмөрийн аюулгүй байдал">
            </div>

            <label><b>2. Юу нэмэхээ сонгох:</b></label>
            <select id="select-add-type" onchange="toggleFormType()">
                <option value="THEORY">📖 Онол (Текст / Зураг) нэмэх</option>
                <option value="QUIZ">🧠 Сорил тест нэмэх</option>
            </select>

            <!-- ОНОЛ НЭМЭХ МАЯГТ -->
            <div id="form-theory-box">
                <label>Онолын гарчиг (Заавал биш):</label>
                <input type="text" id="add-theory-title" placeholder="жишээ нь: 1.1 Аюулгүйн дүрэм">

                <label>Зургийн линк (URL холбоос - Заавал биш):</label>
                <input type="text" id="add-img-url" placeholder="https://example.com/image.jpg">

                <label>Онолын агуулга (Текст):</label>
                <textarea id="add-theory" rows="4" placeholder="Онолын текст энд бичнэ үү..."></textarea>
                
                <button class="btn btn-success" onclick="addTheoryItem()">📖 Онол нэмэх</button>
            </div>

            <!-- СОРИЛ НЭМЭХ МАЯГТ -->
            <div id="form-quiz-box" class="hidden">
                <label>Асуулт бичих:</label>
                <input type="text" id="add-q-text" placeholder="Асуултаа энд бичнэ үү">
                
                <label>Сонголтууд:</label>
                <input type="text" class="add-opt" placeholder="Сонголт А">
                <input type="text" class="add-opt" placeholder="Сонголт Б">
                <input type="text" class="add-opt" placeholder="Сонголт В">
                
                <label>Зөв хариултын дугаар:</label>
                <select id="add-correct">
                    <option value="0">Сонголт А</option>
                    <option value="1">Сонголт Б</option>
                    <option value="2">Сонголт В</option>
                </select>

                <button class="btn btn-success" onclick="addQuizItem()">🧠 Сорил тест нэмэх</button>
            </div>
        </div>

        <h4>Байгаа бүлгүүдийг устгах:</h4>
        <div id="admin-topic-list"></div>
    </div>
</div>

<script>
    let topicsData = JSON.parse(localStorage.getItem('my_topics_v6')) || [
        {
            id: 1,
            title: "1-р бүлэг: Цахилгаан аюулгүй байдал",
            theories: [
                {
                    title: "1.1 Багаж хэрэгслийн шаардлага",
                    imageUrl: "https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=500",
                    text: "Цахилгаан хэрэгсэлтэй ажиллахдаа заавал тусгаарлагч бээлий болон тусгай багаж хэрэгсэл ашиглана."
                }
            ],
            quizzes: [
                {
                    question: "Цахилгаан хүчдэлтэй байгаа хэсэгт ямар багаж ашиглах вэ?",
                    options: ["Энгийн металл бариултай", "Тусгаарлагчтай (изоляцитай)", "Ямар ч хамаагүй"],
                    correct: 1
                }
            ]
        }
    ];

    let currentSelectedTopicIdx = null;

    function saveData() {
        localStorage.setItem('my_topics_v6', JSON.stringify(topicsData));
    }

    function updateTopicSelectOptions() {
        const select = document.getElementById('select-topic');
        select.innerHTML = '';
        
        topicsData.forEach((t, index) => {
            select.innerHTML += `<option value="${index}">${t.title}</option>`;
        });
        select.innerHTML += `<option value="NEW">+ Шинэ бүлэг үүсгэх...</option>`;

        toggleNewTopicInput();
    }

    function toggleNewTopicInput() {
        const selectVal = document.getElementById('select-topic').value;
        const newTopicBox = document.getElementById('new-topic-box');
        if(selectVal === 'NEW') {
            newTopicBox.classList.remove('hidden');
        } else {
            newTopicBox.classList.add('hidden');
        }
    }

    function toggleFormType() {
        const type = document.getElementById('select-add-type').value;
        if(type === 'THEORY') {
            document.getElementById('form-theory-box').classList.remove('hidden');
            document.getElementById('form-quiz-box').classList.add('hidden');
        } else {
            document.getElementById('form-theory-box').classList.add('hidden');
            document.getElementById('form-quiz-box').classList.remove('hidden');
        }
    }

    function renderTopicList() {
        const container = document.getElementById('topics-container');
        container.innerHTML = '';

        if(topicsData.length === 0) {
            container.innerHTML = '<p style="color:#666; text-align:center;">Одоогоор бүлэг нэмэгдээгүй байна.</p>';
            return;
        }

        topicsData.forEach((t, idx) => {
            const thCount = t.theories ? t.theories.length : 0;
            const qCount = t.quizzes ? t.quizzes.length : 0;
            container.innerHTML += `
                <div class="topic-item" onclick="openTopic(${idx})">
                    <h3 style="margin:0 0 5px 0; color:#1e293b;">${t.title}</h3>
                    <span style="font-size:12px; color:#2563eb; font-weight:bold;">📖 ${thCount} онол | 🧠 ${qCount} сорил →</span>
                </div>
            `;
        });
    }

    function openTopic(idx) {
        currentSelectedTopicIdx = idx;
        const topic = topicsData[idx];
        document.getElementById('topic-list-view').classList.add('hidden');
        document.getElementById('topic-detail-view').classList.remove('hidden');
        document.getElementById('detail-topic-title').innerText = topic.title;

        // Онолуудыг харуулах
        const thContainer = document.getElementById('theory-items-container');
        thContainer.innerHTML = '';
        if(topic.theories && topic.theories.length > 0) {
            topic.theories.forEach(th => {
                thContainer.innerHTML += `
                    <div class="card">
                        ${th.title ? `<h3 style="margin-top:0;">${th.title}</h3>` : ''}
                        ${th.imageUrl ? `<img class="lesson-img" src="${th.imageUrl}">` : ''}
                        <p style="line-height:1.6; color:#374151; white-space: pre-line;">${th.text}</p>
                    </div>
                `;
            });
        } else {
            thContainer.innerHTML = '<p style="color:#666; text-align:center;">Одоогоор онол нэмэгдээгүй байна.</p>';
        }

        // Сорил тестийг харуулах
        const qContainer = document.getElementById('quiz-items-container');
        qContainer.innerHTML = '';
        if(topic.quizzes && topic.quizzes.length > 0) {
            topic.quizzes.forEach((q, qIdx) => {
                let optsHtml = '';
                q.options.forEach((opt, oIdx) => {
                    optsHtml += `<div class="quiz-opt" onclick="checkAnswer(${qIdx}, ${oIdx}, ${q.correct})">${opt}</div>`;
                });

                qContainer.innerHTML += `
                    <div class="card">
                        <h4 style="margin-top:0;">${qIdx + 1}. ${q.question}</h4>
                        <div>${optsHtml}</div>
                        <p id="q-res-${qIdx}" style="font-weight:bold; margin-top:10px;"></p>
                    </div>
                `;
            });
        } else {
            qContainer.innerHTML = '<p style="color:#666; text-align:center;">Одоогоор сорил тест нэмэгдээгүй байна.</p>';
        }

        switchSubTab('theory');
    }

    function backToTopics() {
        document.getElementById('topic-detail-view').classList.add('hidden');
        document.getElementById('topic-list-view').classList.remove('hidden');
    }

    function checkAnswer(qIdx, selected, correct) {
        const msg = document.getElementById(`q-res-${qIdx}`);
        if(selected === correct) {
            msg.innerText = "✅ Зөв байна!";
            msg.style.color = "#16a34a";
        } else {
            msg.innerText = "❌ Буруу байна! Дахин оролдоорой.";
            msg.style.color = "#dc2626";
        }
    }

    function switchSubTab(type) {
        if(type === 'theory') {
            document.getElementById('sub-btn-theory').classList.add('active');
            document.getElementById('sub-btn-quiz').classList.remove('active');
            document.getElementById('sub-tab-theory').classList.remove('hidden');
            document.getElementById('sub-tab-quiz').classList.add('hidden');
        } else {
            document.getElementById('sub-btn-quiz').classList.add('active');
            document.getElementById('sub-btn-theory').classList.remove('active');
            document.getElementById('sub-tab-quiz').classList.remove('hidden');
            document.getElementById('sub-tab-theory').classList.add('hidden');
        }
    }

    function getOrCreateTopicIdx() {
        const selectVal = document.getElementById('select-topic').value;
        if(selectVal === 'NEW') {
            const newTitle = document.getElementById('add-new-topic-name').value.trim();
            if(!newTitle) {
                alert("Шинэ бүлгийн нэрийг бичнэ үү!");
                return null;
            }
            const newObj = { id: Date.now(), title: newTitle, theories: [], quizzes: [] };
            topicsData.push(newObj);
            return topicsData.length - 1;
        }
        return parseInt(selectVal);
    }

    function addTheoryItem() {
        const topicIdx = getOrCreateTopicIdx();
        if(topicIdx === null) return;

        const title = document.getElementById('add-theory-title').value;
        const imageUrl = document.getElementById('add-img-url').value;
        const text = document.getElementById('add-theory').value;

        if(!text) {
            alert("Онолын текстыг заавал бичнэ үү!");
            return;
        }

        if(!topicsData[topicIdx].theories) topicsData[topicIdx].theories = [];
        topicsData[topicIdx].theories.push({ title, imageUrl, text });

        saveData();
        renderTopicList();
        renderAdminList();
        updateTopicSelectOptions();

        alert("Онол амжилттай нэмэгдлээ!");
        document.getElementById('add-theory-title').value = '';
        document.getElementById('add-img-url').value = '';
        document.getElementById('add-theory').value = '';
    }

    function addQuizItem() {
        const topicIdx = getOrCreateTopicIdx();
        if(topicIdx === null) return;

        const qText = document.getElementById('add-q-text').value;
        const optElements = document.querySelectorAll('.add-opt');
        const correct = parseInt(document.getElementById('add-correct').value);

        if(!qText || !optElements[0].value || !optElements[1].value) {
            alert("Асуулт болон сонголтуудыг бүрэн бичнэ үү!");
            return;
        }

        if(!topicsData[topicIdx].quizzes) topicsData[topicIdx].quizzes = [];
        topicsData[topicIdx].quizzes.push({
            question: qText,
            options: [optElements[0].value, optElements[1].value, optElements[2].value],
            correct: correct
        });

        saveData();
        renderTopicList();
        renderAdminList();
        updateTopicSelectOptions();

        alert("Сорил тест амжилттай нэмэгдлээ!");
        document.getElementById('add-q-text').value = '';
        optElements.forEach(o => o.value = '');
    }

    function renderAdminList() {
        const container = document.getElementById('admin-topic-list');
        container.innerHTML = '';

        topicsData.forEach((t, idx) => {
            container.innerHTML += `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <b>${t.title}</b>
                    <button class="btn btn-danger" onclick="deleteTopic(${idx})">Устгах</button>
                </div>
            `;
        });
    }

    function deleteTopic(idx) {
        if(confirm("Энэ бүлгийг бүх онол, сорилтой нь устгах уу?")) {
            topicsData.splice(idx, 1);
            saveData();
            renderTopicList();
            renderAdminList();
            updateTopicSelectOptions();
        }
    }

    function switchTab(tab) {
        if(tab === 'learn') {
            document.getElementById('btn-learn').classList.add('active');
            document.getElementById('btn-admin').classList.remove('active');
            document.getElementById('tab-learn').classList.remove('hidden');
            document.getElementById('tab-admin').classList.add('hidden');
            backToTopics();
        } else {
            document.getElementById('btn-admin').classList.add('active');
            document.getElementById('btn-learn').classList.remove('active');
            document.getElementById('tab-admin').classList.remove('hidden');
            document.getElementById('tab-learn').classList.add('hidden');
            updateTopicSelectOptions();
        }
    }

    renderTopicList();
    renderAdminList();
    updateTopicSelectOptions();
</script>

</body>
</html>
