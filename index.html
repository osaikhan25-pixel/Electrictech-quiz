<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сургалтын ба Сорилын Апп</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f4f6f8; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-container { background: white; width: 100%; max-width: 500px; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .nav-btns { display: flex; gap: 8px; margin-bottom: 20px; }
        .nav-btn { flex: 1; padding: 12px; border: none; background: #eef2f5; color: #555; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .nav-btn.active { background: #2563eb; color: white; }
        
        .topic-badge { background: #e0e7ff; color: #3730a3; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-block; margin-bottom: 8px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .btn { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 15px; }
        .btn-danger { background: #dc2626; padding: 6px 12px; font-size: 13px; }
        .btn-success { background: #16a34a; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
        .quiz-opt { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px; border-radius: 8px; margin-top: 8px; cursor: pointer; transition: background 0.2s; }
        .quiz-opt:active { background: #e2e8f0; }
        .hidden { display: none; }
        .topic-header { background: #f1f5f9; padding: 10px; border-radius: 8px; margin-top: 15px; margin-bottom: 10px; border-left: 4px solid #2563eb; font-weight: bold; color: #1e293b; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- ТАБ ТОВЧНУУД -->
    <div class="nav-btns">
        <button id="btn-learn" class="nav-btn active" onclick="switchTab('learn')">📖 Хичээл & Сорил</button>
        <button id="btn-admin" class="nav-btn" onclick="switchTab('admin')">⚙️ Засварлах</button>
    </div>

    <!-- 1. НҮҮР ХҮҮДЭС (ХИЧЭЭЛҮҮД) -->
    <div id="tab-learn">
        <div id="topic-filter-container" style="margin-bottom: 15px;">
            <label style="font-size: 13px; font-weight: bold; color: #64748b;">Сэдвээр шүүх:</label>
            <select id="filter-topic" onchange="renderLessons()" style="margin-top: 4px;">
                <option value="ALL">Бүх сэдэв</option>
            </select>
        </div>
        <div id="lesson-list"></div>
    </div>

    <!-- 2. ЗАСВАРЛАХ ХЭСЭГ (EDITOR) -->
    <div id="tab-admin" class="hidden">
        <h3>⚙️ Шинэ хичээл & сорил нэмэх</h3>
        <div class="card">
            <label>Сэдвийн нэр (Ангилал):</label>
            <input type="text" id="add-topic" placeholder="жишээ нь: Цахилгаан техник, Сэдэв 1 гэх мэт">

            <label>Хичээлийн гарчиг:</label>
            <input type="text" id="add-title" placeholder="жишээ нь: Омын хууль">
            
            <label>Онол (Агуулга):</label>
            <textarea id="add-theory" rows="4" placeholder="Хичээлийн онолыг энд бичнэ үү..."></textarea>
            
            <hr style="border:none; border-top:1px dashed #ccc; margin:15px 0;">
            <h4 style="margin-top:0;">❓ Сорил тест нэмэх</h4>
            <label>Асуулт:</label>
            <input type="text" id="add-q-text" placeholder="Асуултаа энд бичнэ үү">
            
            <label>Сонголтууд:</label>
            <input type="text" class="add-opt" placeholder="Сонголт А">
            <input type="text" class="add-opt" placeholder="Сонголт Б">
            <input type="text" class="add-opt" placeholder="Сонголт В">
            
            <label>Зөв хариултын дугаар:</label>
            <select id="add-correct">
                <option value="0">Сонголт А</option>
                <option value="1">Сонголт Б</option>
                <option value="2">Сонголт В</option>
            </select>

            <button class="btn btn-success" onclick="saveLesson()">🚀 Санах ойд хадгалах</button>
        </div>

        <div id="admin-manage-list"></div>
    </div>
</div>

<script>
    // Санах ойгоос дата авна
    let lessons = JSON.parse(localStorage.getItem('my_lessons_v2')) || [
        {
            id: 1,
            topic: "Хөдөлмөрийн аюулгүй байдал",
            title: "1. Цахилгааны аюулгүй ажиллагаа",
            theory: "Цахилгаан хэрэгсэлтэй ажиллахдаа заавал тусгаарлагч бээлий болон тусгай багаж хэрэгсэл ашиглах шаардлагатай.",
            quiz: {
                question: "Цахилгаан хүчдэлтэй байгаа хэсэгт ямар багаж ашиглах вэ?",
                options: ["Энгийн металл бариултай", "Тусгаарлагчтай (изоляцитай)", "Ямар ч хамаагүй"],
                correct: 1
            }
        }
    ];

    function saveToStorage() {
        localStorage.setItem('my_lessons_v2', JSON.stringify(lessons));
    }

    function updateTopicFilterOptions() {
        const filterSelect = document.getElementById('filter-topic');
        const currentVal = filterSelect.value;
        const topics = [...new Set(lessons.map(l => l.topic || "Бусад"))];

        filterSelect.innerHTML = '<option value="ALL">Бүх сэдэв харах</option>';
        topics.forEach(t => {
            filterSelect.innerHTML += `<option value="${t}">${t}</option>`;
        });
        filterSelect.value = currentVal;
    }

    function renderLessons() {
        const container = document.getElementById('lesson-list');
        const selectedTopic = document.getElementById('filter-topic').value;
        container.innerHTML = '';

        updateTopicFilterOptions();

        let filtered = lessons;
        if(selectedTopic !== 'ALL') {
            filtered = lessons.filter(l => (l.topic || "Бусад") === selectedTopic);
        }

        if (filtered.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px;">Энэ сэдэвт хичээл одоогоор алга байна.</p>';
            return;
        }

        filtered.forEach((l, index) => {
            container.innerHTML += `
                <div class="card">
                    <span class="topic-badge">📂 ${l.topic || "Бусад"}</span>
                    <h2 style="margin-top:5px; margin-bottom:10px;">${l.title}</h2>
                    <p style="color:#4b5563; line-height: 1.5;">${l.theory}</p>
                    <hr style="border:none; border-top:1px solid #eee; margin:15px 0;">
                    <h4 style="margin:5px 0;">🧠 Сорил тест</h4>
                    <p><b>${l.quiz.question}</b></p>
                    ${l.quiz.options.map((opt, i) => `
                        <div class="quiz-opt" onclick="checkAnswer(${index}, ${i}, ${l.quiz.correct}, this)">
                            ${opt}
                        </div>
                    `).join('')}
                    <p id="res-${index}" style="font-weight:bold; margin-top:10px;"></p>
                </div>
            `;
        });
    }

    function renderAdminList() {
        const container = document.getElementById('admin-manage-list');
        container.innerHTML = '<h4>Нэмэгдсэн хичээлүүд:</h4>';

        lessons.forEach((l, index) => {
            container.innerHTML += `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <small style="color:#6b7280;">[${l.topic || "Бусад"}]</small><br>
                        <b>${l.title}</b>
                    </div>
                    <button class="btn btn-danger" style="width:auto; margin:0;" onclick="deleteLesson(${index})">Устгах</button>
                </div>
            `;
        });
    }

    function saveLesson() {
        const topic = document.getElementById('add-topic').value.trim() || "Ерөнхий сэдэв";
        const title = document.getElementById('add-title').value;
        const theory = document.getElementById('add-theory').value;
        const qText = document.getElementById('add-q-text').value;
        const optElements = document.querySelectorAll('.add-opt');
        const correct = parseInt(document.getElementById('add-correct').value);

        if(!title || !theory || !qText) {
            alert("Гарчиг, онол болон асуултыг бүрэн засаж оруулна уу!");
            return;
        }

        lessons.push({
            id: Date.now(),
            topic: topic,
            title: title,
            theory: theory,
            quiz: {
                question: qText,
                options: [optElements[0].value, optElements[1].value, optElements[2].value],
                correct: correct
            }
        });

        saveToStorage();
        renderLessons();
        renderAdminList();

        alert("Амжилттай хадгалагдлаа!");
        document.getElementById('add-title').value = '';
        document.getElementById('add-theory').value = '';
        document.getElementById('add-q-text').value = '';
        optElements.forEach(o => o.value = '');
    }

    function deleteLesson(index) {
        if(confirm("Энэ хичээлийг устгах уу?")) {
            lessons.splice(index, 1);
            saveToStorage();
            renderLessons();
            renderAdminList();
        }
    }

    function checkAnswer(lessonIdx, selectedOpt, correctOpt, el) {
        const resEl = document.getElementById(`res-${lessonIdx}`);
        if(selectedOpt === correctOpt) {
            resEl.innerText = "✅ Зөв байна! Амжилттай.";
            resEl.style.color = "#16a34a";
        } else {
            resEl.innerText = "❌ Буруу байна! Дахин оролдоорой.";
            resEl.style.color = "#dc2626";
        }
    }

    function switchTab(tab) {
        if(tab === 'learn') {
            document.getElementById('btn-learn').classList.add('active');
            document.getElementById('btn-admin').classList.remove('active');
            document.getElementById('tab-learn').classList.remove('hidden');
            document.getElementById('tab-admin').classList.add('hidden');
        } else {
            document.getElementById('btn-admin').classList.add('active');
            document.getElementById('btn-learn').classList.remove('active');
            document.getElementById('tab-learn').classList.remove('hidden');
            document.getElementById('tab-admin').classList.remove('hidden');
            document.getElementById('tab-learn').classList.add('hidden');
        }
    }

    // Анх нээгдэхэд ажиллуулах
    renderLessons();
    renderAdminList();
</script>

</body>
</html>
